name: 淘股吧监控

on:
  schedule:
    - cron: '*/10 0-15 * * *'      # 北京 08:00-23:59 每10分钟
    - cron: '23 16-23,0-1 * * *'   # 夜间每小时
  workflow_dispatch:

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 检查淘股吧更新
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: python3 tgb_watch.py
      - name: 回写状态
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tgb_state.json
          git diff --cached --quiet || git commit -m "state: tgb基线更新"
          git push
