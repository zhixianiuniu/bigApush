name: chan-scan
on:
  schedule:
    - cron: '40 7 * * 1-5'    # UTC 07:40 = 北京时间 15:40, 周一到周五
  workflow_dispatch:          # 允许手动点运行
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 缠论盘后扫描
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          STATE_FILE: chan_state.json
          SCAN_NO_PAUSE: '1'
        run: python3 scan_chan.py
      - name: 回写状态(供次日比对)
        run: |
          git config user.name "chan-bot"
          git config user.email "chan-bot@users.noreply.github.com"
          git add chan_state.json
          git commit -m "chore: save chan state [skip ci]" || echo "state unchanged"
          git push
